name: Fraud Engine CI

on:
  pull_request:
    paths:
      - "services/payguard-fraud-engine/**"
      - ".github/workflows/fraud-engine-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/payguard-fraud-engine/**"
      - ".github/workflows/fraud-engine-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payguard-fraud-engine
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify fraud engine
        run: mvn verify
