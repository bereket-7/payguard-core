name: API Gateway CI

on:
  pull_request:
    paths:
      - "services/payguard-api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/payguard-api-gateway/**"
      - ".github/workflows/api-gateway-ci.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payguard-api-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify API gateway
        run: mvn verify
